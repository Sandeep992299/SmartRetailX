apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smartretailx
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: 595529181954.dkr.ecr.us-east-1.amazonaws.com/smartretailx-api-gateway:v1.0.0
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        env:
        - name: USER_SERVICE_URL
          value: "http://user-service:8001"
        - name: PRODUCT_SERVICE_URL
          value: "http://product-service:8002"
        - name: ORDER_SERVICE_URL
          value: "http://order-service:8003"
        - name: PAYMENT_SERVICE_URL
          value: "http://payment-service:8004"
        - name: INVENTORY_SERVICE_URL
          value: "http://inventory-service:8005"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: AWS_XRAY_DAEMON_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smartretailx
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: api-gateway
  type: LoadBalancer
