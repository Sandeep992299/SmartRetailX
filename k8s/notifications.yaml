apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: smartretailx
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8006"
    spec:
      containers:
      - name: notification-service
        image: 595529181954.dkr.ecr.us-east-1.amazonaws.com/smartretailx-notification-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8006
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "b-2.prodkafkabroker.4iqg5x.c24.kafka.us-east-1.amazonaws.com:9092,b-1.prodkafkabroker.4iqg5x.c24.kafka.us-east-1.amazonaws.com:9092"
        - name: SES_SENDER_EMAIL
          value: "dissanayakesandeep@gmail.com"
        - name: SES_RECIPIENT_EMAIL
          value: "dissanayakesandeep@gmail.com"
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: XRAY_DAEMON_HOST
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: smartretailx
spec:
  ports:
  - port: 8006
    targetPort: 8006
  selector:
    app: notification-service
  type: ClusterIP




